<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>PipeCalc — 배관 압력강하 1차 검토</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── 디자인 토큰 ── */
:root{
  --bg:#0f1623; --bg2:#0b1019; --card:#141d2e; --card2:#1a2436; --card3:#16213a;
  --line:rgba(255,255,255,0.10); --line2:rgba(255,255,255,0.06);
  --txt:#e8edf5; --txt2:#9aa6b8; --txt3:#6b7689;
  --pass:#22c55e; --fail:#ef4444; --info:#4d8ef5; --warn:#f59e0b; --special:#a78bfa;
  --r:13px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--txt);
  font-family:'Noto Sans KR',sans-serif; -webkit-font-smoothing:antialiased;}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
.mono{font-family:'JetBrains Mono',monospace;}
.app{max-width:460px; margin:0 auto; min-height:100vh;}

/* ── 헤더 ── */
.hdr{background:var(--bg2); padding:14px 16px; border-bottom:0.5px solid var(--line2);
  display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:30;}
.hdr-l{display:flex; align-items:center; gap:8px;}
.hdr-l b{font-weight:700; font-size:17px;}
.hdr .ico{color:var(--info); font-size:20px;}
.hdr-tag{color:var(--txt3); font-size:11px;}

/* ── 요약바 ── */
.sumbar{background:var(--card); padding:10px 16px; border-bottom:0.5px solid var(--line2);
  position:sticky; top:49px; z-index:29; font-size:13px;}
.sumbar .lbl{color:var(--txt3); font-size:11px; margin-right:6px;}
.sumbar .val{color:var(--txt2);}
.sumbar .val.on{color:var(--txt);}

/* ── 본문 ── */
.body{padding:16px;}
.fld{margin-bottom:14px;}
.fld>label{color:var(--txt2); font-size:12px; display:block; margin-bottom:6px;}
.row{display:flex; gap:8px;}
.row>.fld{flex:1; margin-bottom:0;}
.row.mb{margin-bottom:14px;}

/* 입력 */
.inp,.selbtn{width:100%; background:var(--card2); color:var(--txt); border:0.5px solid var(--line);
  border-radius:9px; min-height:46px; font-size:15px; padding:0 12px;}
.inp{font-family:'JetBrains Mono',monospace;}
.inwrap{display:flex; align-items:center; background:var(--card2); border:0.5px solid var(--line);
  border-radius:9px; min-height:46px; padding:0 12px;}
.inwrap input{flex:1; width:100%; background:transparent; color:var(--txt); border:none; outline:none;
  font-family:'JetBrains Mono',monospace; font-size:15px;}
.inwrap .u{color:var(--txt3); font-size:12px; margin-left:6px;}

/* 셀렉트 버튼(휠/바텀시트 트리거) */
.selbtn{display:flex; align-items:center; justify-content:space-between; cursor:pointer; text-align:left;}
.selbtn span{color:var(--txt);} .selbtn i{color:var(--txt3); font-size:18px;}

/* 토글 */
.seg{display:flex; gap:6px; background:var(--bg2); border-radius:11px; padding:4px; margin-bottom:16px;}
.seg button{flex:1; background:transparent; color:var(--txt3); border:none; border-radius:8px;
  padding:11px; font-size:14px; font-weight:500; min-height:44px; cursor:pointer; font-family:inherit;}
.seg button.act{background:var(--info); color:#fff;}
.seg.liq button.act{background:var(--info);}

/* 추정 물성 카드 */
.estcard{background:var(--card3); border:0.5px solid rgba(167,139,250,0.32); border-radius:11px; padding:13px; margin-bottom:16px;}
.estcard .top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.estcard .top .l{display:flex; align-items:center; gap:6px; color:#c4b5fd; font-size:12px; font-weight:500;}
.estcard .top .l i{color:var(--special); font-size:16px;}
.estcard .badge{color:var(--special); font-size:11px; border:0.5px solid rgba(167,139,250,0.4); border-radius:5px; padding:2px 7px;}
.estgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.estitem{background:var(--bg2); border-radius:7px; padding:7px 9px;}
.estitem .k{color:var(--txt3); font-size:10px;}
.estitem .v{color:var(--txt); font-family:'JetBrains Mono',monospace; font-size:13px; margin-top:2px;}
.estitem.edit{outline:1px solid rgba(167,139,250,0.5);}
.estitem input{width:100%; background:transparent; border:none; color:var(--special);
  font-family:'JetBrains Mono',monospace; font-size:13px; outline:none; margin-top:2px;}

/* 계산 버튼 */
.calc{width:100%; background:var(--info); color:#fff; border:none; border-radius:11px;
  padding:15px; font-size:16px; font-weight:700; min-height:54px; cursor:pointer; font-family:inherit;
  display:flex; align-items:center; justify-content:center; gap:7px;}
.calc:active{transform:scale(0.99);}

/* 결과 */
.result{margin-top:18px;}
.verdict{border-radius:13px; padding:16px; display:flex; align-items:center; gap:12px; margin-bottom:14px;}
.verdict.pass{background:rgba(34,197,94,0.12); border:0.5px solid rgba(34,197,94,0.4);}
.verdict.fail{background:rgba(239,68,68,0.12); border:0.5px solid rgba(239,68,68,0.4);}
.verdict .vi{font-size:34px;} .verdict.pass .vi{color:var(--pass);} .verdict.fail .vi{color:var(--fail);}
.verdict .vt b{font-size:20px; font-weight:700;} .verdict.pass .vt b{color:var(--pass);} .verdict.fail .vt b{color:var(--fail);}
.verdict .vt div{color:var(--txt2); font-size:12px; margin-top:2px;}

.metrics{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
.metric{background:var(--card); border-radius:10px; padding:12px;}
.metric .mk{color:var(--txt3); font-size:11px;}
.metric .mv{font-family:'JetBrains Mono',monospace; font-size:19px; margin-top:3px;}
.metric .ma{font-size:10px; margin-top:3px;}
.metric.ok .mv{color:var(--txt);} .metric.bad .mv{color:var(--fail);} .metric.ok .ma{color:var(--txt3);} .metric.bad .ma{color:var(--fail);}

.detoggle{width:100%; background:var(--card); border:0.5px solid var(--line); color:var(--txt2);
  border-radius:9px; padding:11px; font-size:13px; cursor:pointer; font-family:inherit; margin-bottom:10px;}
.details{background:var(--card); border-radius:10px; padding:13px; display:none;}
.details.show{display:block;}
.details .dl{display:flex; justify-content:space-between; padding:5px 0; border-bottom:0.5px solid var(--line2); font-size:13px;}
.details .dl:last-child{border:none;}
.details .dl .dk{color:var(--txt3);} .details .dl .dv{font-family:'JetBrains Mono',monospace;}

.disclaimer{margin-top:14px; padding:11px 13px; background:rgba(245,158,11,0.08);
  border:0.5px solid rgba(245,158,11,0.25); border-radius:9px; color:#fbbf6b; font-size:11px; line-height:1.6;}

/* ── 휠 피커 ── */
.scrim{position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:50; display:none; align-items:flex-end;}
.scrim.show{display:flex;}
.sheet{width:100%; max-width:460px; margin:0 auto; background:var(--card); border-radius:18px 18px 0 0;
  padding:8px 0 calc(8px + env(safe-area-inset-bottom));}
.sheet-hd{display:flex; align-items:center; justify-content:space-between; padding:10px 16px; border-bottom:0.5px solid var(--line2);}
.sheet-hd b{font-size:15px;} .sheet-hd button{background:none; border:none; color:var(--info); font-size:15px; font-weight:700; font-family:inherit;}
.sheet-hd .cancel{color:var(--txt3); font-weight:400;}

.wheel{position:relative; height:220px; overflow:hidden; -webkit-mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent);
  mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent);}
.wheel .sel{position:absolute; left:14px; right:14px; top:88px; height:44px; border-top:0.5px solid var(--line);
  border-bottom:0.5px solid var(--line); pointer-events:none;}
.wheel ul{list-style:none; margin:0; padding:88px 0; touch-action:none;}
.wheel li{height:44px; line-height:44px; text-align:center; font-size:17px; color:var(--txt2);
  font-family:'JetBrains Mono',monospace; transition:color .1s;}
.wheel li.center{color:var(--txt); font-weight:500;}

/* ── 바텀시트 검색 ── */
.searchwrap{padding:12px 16px;}
.searchwrap input{width:100%; background:var(--card2); border:0.5px solid var(--line); border-radius:9px;
  min-height:44px; padding:0 12px; color:var(--txt); font-size:15px; font-family:inherit; outline:none;}
.flist{max-height:46vh; overflow-y:auto; padding:0 8px 8px;}
.flist .fitem{display:flex; align-items:center; justify-content:space-between; padding:13px 12px;
  border-radius:9px; cursor:pointer; min-height:48px;}
.flist .fitem:active{background:var(--card2);}
.flist .fitem .fn{font-size:15px;} .flist .fitem .ft{color:var(--txt3); font-size:11px;}
.flist .fitem.sel .fn{color:var(--info); font-weight:500;}
.flist .nores{padding:24px; text-align:center; color:var(--txt3); font-size:13px; line-height:1.6;}
</style>
</head>
<body>
<div class="app">

  <!-- 헤더 -->
  <div class="hdr">
    <div class="hdr-l"><span class="ico">⬡</span><b>PipeCalc</b></div>
    <span class="hdr-tag">FEED 1차검토 ±10~20%</span>
  </div>

  <!-- 요약바 -->
  <div class="sumbar">
    <span class="lbl">결과</span><span class="val mono" id="sumval">v=— · ΔP=— · Ma=— · Out=—</span>
  </div>

  <div class="body">
    <!-- 상태 토글 -->
    <div class="seg" id="phaseSeg">
      <button class="act" data-ph="gas">기체 Gas</button>
      <button data-ph="liquid">액체 Liquid</button>
    </div>

    <!-- 유체 (바텀시트) -->
    <div class="fld">
      <label>유체 Fluid</label>
      <button class="selbtn" id="fluidBtn"><span id="fluidLbl">천연가스 (NG)</span><i>⌄</i></button>
    </div>

    <!-- 유량 -->
    <div class="fld">
      <label>유량 Flow Rate</label>
      <div class="row">
        <div class="inwrap" style="flex:1;"><input id="flow" inputmode="decimal" value="5000"/></div>
        <button class="selbtn" id="flowUnitBtn" style="width:108px;"><span id="flowUnitLbl">Nm³/h</span><i>⌄</i></button>
      </div>
    </div>

    <!-- 압력/온도 -->
    <div class="row mb">
      <div class="fld"><label>입구 압력</label>
        <div class="inwrap"><input id="pres" inputmode="decimal" value="50"/><span class="u">barg</span></div></div>
      <div class="fld"><label>입구 온도</label>
        <div class="inwrap"><input id="temp" inputmode="decimal" value="40"/><span class="u">℃</span></div></div>
    </div>

    <!-- NPS/Schedule (휠) -->
    <div class="row mb">
      <div class="fld"><label>배관 Size (NPS)</label>
        <button class="selbtn" id="npsBtn"><span id="npsLbl">6"</span><i>⌄</i></button></div>
      <div class="fld"><label>Schedule</label>
        <button class="selbtn" id="schBtn"><span id="schLbl">Sch 40</span><i>⌄</i></button></div>
    </div>

    <!-- 재질 (휠) -->
    <div class="fld">
      <label>배관 재질 Material <span style="color:var(--special)">→ ε 자동</span></label>
      <button class="selbtn" id="matBtn"><span id="matLbl">탄소강 신관</span><i>⌄</i></button>
    </div>

    <!-- 길이 -->
    <div class="fld">
      <label>길이 Length</label>
      <div class="inwrap"><input id="len" inputmode="decimal" value="200"/><span class="u">m</span></div>
    </div>

    <!-- 추정 물성 카드 -->
    <div class="estcard">
      <div class="top">
        <div class="l">⚗ 자동 추정 물성</div>
        <span class="badge">추정 · 탭하여 수정</span>
      </div>
      <div class="estgrid" id="estGrid"></div>
    </div>

    <!-- 계산 -->
    <button class="calc" id="calcBtn">▶ 계산하기</button>

    <!-- 결과 -->
    <div class="result" id="result" style="display:none;"></div>
  </div>
</div>

<!-- 휠 피커 시트 -->
<div class="scrim" id="wheelScrim">
  <div class="sheet">
    <div class="sheet-hd"><button class="cancel" id="wheelCancel">취소</button><b id="wheelTitle">선택</b><button id="wheelDone">완료</button></div>
    <div class="wheel" id="wheel"><div class="sel"></div><ul id="wheelList"></ul></div>
  </div>
</div>

<!-- 유체 바텀시트 -->
<div class="scrim" id="fluidScrim">
  <div class="sheet">
    <div class="sheet-hd"><button class="cancel" id="fluidCancel">취소</button><b>유체 선택</b><span style="width:36px"></span></div>
    <div class="searchwrap"><input id="fluidSearch" placeholder="유체명 검색 (예: 질소, N2)" /></div>
    <div class="flist" id="fluidList"></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════
//  PipeCalc v4 — 단일 HTML / 순수 JS (프레임워크 없음)
// ══════════════════════════════════════════════════════════
"use strict";
const $ = id => document.getElementById(id);
const round = (x,n)=>{const p=10**n; return Math.round(x*p)/p;};

// ── 상수 ──
const R_UNIV=8.314462618, T0=273.15;

// ── 1. 물성 DB (13종) ──  출처: Reid/Poling, NIST, GPSA
const FLUID_DB = {
  NG:{label:'천연가스 (NG)',phase:'gas',MW:17.4,Tc:195.0,Pc:4640e3,omega:0.012,k:1.30,note:'메탄우세 혼합근사',conf:'mid'},
  LNG_BOG:{label:'LNG BOG',phase:'gas',MW:17.0,Tc:190.0,Pc:4560e3,omega:0.011,k:1.31,note:'BOG 조성변동 큼',conf:'low'},
  N2:{label:'질소 (N₂)',phase:'gas',MW:28.013,Tc:126.2,Pc:3390e3,omega:0.037,k:1.40,note:'순물질 고신뢰',conf:'high'},
  AIR:{label:'공기 (Air)',phase:'gas',MW:28.96,Tc:132.5,Pc:3770e3,omega:0.035,k:1.40,note:'의사임계물성',conf:'high'},
  STEAM:{label:'수증기 (Steam)',phase:'gas',MW:18.015,Tc:647.1,Pc:22060e3,omega:0.344,k:1.33,note:'극성 큼, IAPWS 권장',conf:'low'},
  H2:{label:'수소 (H₂)',phase:'gas',MW:2.016,Tc:33.2,Pc:1300e3,omega:-0.216,k:1.41,note:'양자유체, 상온 Z>1',conf:'mid'},
  CO2:{label:'이산화탄소 (CO₂)',phase:'gas',MW:44.01,Tc:304.2,Pc:7383e3,omega:0.224,k:1.29,note:'임계점근처 주의',conf:'mid'},
  ETHYLENE:{label:'에틸렌 (C₂H₄)',phase:'gas',MW:28.054,Tc:282.3,Pc:5040e3,omega:0.087,k:1.24,note:'순물질',conf:'high'},
  PROPYLENE:{label:'프로필렌 (C₃H₆)',phase:'gas',MW:42.081,Tc:364.9,Pc:4600e3,omega:0.142,k:1.15,note:'가압시 액화근접',conf:'high'},
  WATER:{label:'물 (Water)',phase:'liquid',MW:18.015,rhoCoef:[999.85,0.0531,-0.00746],muCoef:{A:2.414e-5,B:247.8,C:140.0,type:'vogel'},note:'0~100℃',conf:'high'},
  COOLING_WATER:{label:'냉각수 (Cooling Water)',phase:'liquid',MW:18.02,rhoCoef:[1000.5,0.0531,-0.00746],muCoef:{A:2.414e-5,B:247.8,C:140.0,type:'vogel'},note:'물 근사',conf:'mid'},
  METHANOL:{label:'메탄올 (CH₃OH)',phase:'liquid',MW:32.042,rhoCoef:[810.0,-0.92,0.0],muCoef:{A:7.02e-5,B:555.3,type:'arr'},note:'0~50℃ 인화성',conf:'mid'},
  ETHANOL:{label:'에탄올 (C₂H₅OH)',phase:'liquid',MW:46.069,rhoCoef:[806.0,-0.85,0.0],muCoef:{A:8.40e-5,B:686.6,type:'arr'},note:'0~50℃ 인화성',conf:'mid'}
};

// ── 재질별 절대조도 ε (mm) ──
const MATERIALS=[
  {key:'copper',label:'동관',eps:0.0015},
  {key:'ss',label:'스테인리스 (SS)',eps:0.015},
  {key:'cs',label:'탄소강 신관',eps:0.045},
  {key:'galv',label:'아연도금강',eps:0.15},
  {key:'cast',label:'주철',eps:0.26},
  {key:'old',label:'노후 탄소강',eps:1.0}
];

// ── NPS 내경(mm) : Sch별 (대표값, 추후 전체확장 필요) ──
const PIPE_ID = {
  '2"':{'Sch 40':52.5,'Sch 80':49.2,'Sch 160':42.8},
  '3"':{'Sch 40':77.9,'Sch 80':73.7,'Sch 160':66.6},
  '4"':{'Sch 40':102.3,'Sch 80':97.2,'Sch 160':87.3},
  '6"':{'Sch 40':154.1,'Sch 80':146.3,'Sch 160':131.8},
  '8"':{'Sch 40':202.7,'Sch 80':193.7,'Sch 160':173.1},
  '10"':{'Sch 40':254.5,'Sch 80':242.9,'Sch 160':215.9},
  '12"':{'Sch 40':303.2,'Sch 80':288.9,'Sch 160':257.2}
};
const NPS_LIST=Object.keys(PIPE_ID);
const SCH_LIST=['Sch 40','Sch 80','Sch 160'];
const FLOWUNITS=['Nm³/h','kg/h','m³/h'];

// ── 2. Z-factor 2종 ──
function zPitzer(T,P,f){
  const Tr=T/f.Tc, Pr=P/f.Pc;
  const B0=0.083-0.422/Math.pow(Tr,1.6), B1=0.139-0.172/Math.pow(Tr,4.2);
  const Z=1+(B0+f.omega*B1)*Pr/Tr;
  return {Z,Tr,Pr,reliable:(Tr>=0.6&&Pr<=3.0)};
}
function zStandingKatz(T,P,f){
  const Tpr=T/f.Tc, Ppr=P/f.Pc;
  const A=[0.3265,-1.0700,-0.5339,0.01569,-0.05165,0.5475,-0.7361,0.1844,0.1056,0.6134,0.7210];
  const t=1/Tpr; let r=0.27*Ppr/Tpr;
  for(let i=0;i<25;i++){
    const c1=A[0]+A[1]*t+A[2]*t**3+A[3]*t**4+A[4]*t**5;
    const c2=A[5]+A[6]*t+A[7]*t**2; const c3=A[8]*(A[6]*t+A[7]*t**2);
    const e=Math.exp(-A[10]*r**2);
    const Zc=1+c1*r+c2*r**2-c3*r**5+A[9]*(1+A[10]*r**2)*(r**2/Tpr**3)*e;
    const rn=0.27*Ppr/(Zc*Tpr); if(Math.abs(rn-r)<1e-8){r=rn;break;} r=rn;
  }
  const Z=0.27*Ppr/(r*Tpr);
  return {Z,Tpr,Ppr,reliable:(Tpr>=1.05&&Tpr<=3.0&&Ppr>=0.2&&Ppr<=15)};
}
function compareZ(T,P,f){
  const a=zPitzer(T,P,f), b=zStandingKatz(T,P,f);
  const diff=Math.abs(a.Z-b.Z)/a.Z*100;
  const useSK=(f.label.includes('NG')||f.label.includes('BOG'));
  return {pitzer:a,sk:b,diff,recommended:useSK?b.Z:a.Z,by:useSK?'SK':'Pitzer',
    warn:diff>15?'두 Z 편차 15%↑ — 임계점 근처 가능, 실측 권장':null};
}

// ── 3. 물성 계산 ──
function gasDensity(T,P,f,Z){return P*(f.MW/1000)/(Z*R_UNIV*T);}
function gasViscosityLGE(T,f,rho){
  const M=f.MW, TR=T*1.8;
  const K=(9.4+0.02*M)*Math.pow(TR,1.5)/(209+19*M+TR);
  const X=3.5+986/TR+0.01*M, Y=2.4-0.2*X;
  return 1e-4*K*Math.exp(X*Math.pow(rho/1000,Y))*1e-3;
}
function liquidDensity(Tc,f){const[a0,a1,a2]=f.rhoCoef; return a0+a1*Tc+a2*Tc*Tc;}
function liquidViscosity(Tc,f){
  const T=Tc+T0, m=f.muCoef;
  if(m.type==='vogel') return m.A*Math.pow(10,m.B/(T-m.C));
  return m.A*Math.exp(m.B/T);
}
function estimateProperties(key,Tc,Pbarg){
  const f=FLUID_DB[key]; if(!f) return {ok:false};
  const T=Tc+T0, P=(Pbarg+1.01325)*1e5;
  if(f.phase==='gas'){
    const zc=compareZ(T,P,f), Z=zc.recommended;
    const rho=gasDensity(T,P,f,Z), mu=gasViscosityLGE(T,f,rho);
    return {ok:true,phase:'gas',MW:f.MW,k:f.k,Z:round(Z,4),rho:round(rho,3),mu,zc,note:f.note,conf:f.conf};
  } else {
    const rho=liquidDensity(Tc,f), mu=liquidViscosity(Tc,f);
    return {ok:true,phase:'liquid',MW:f.MW,rho:round(rho,2),mu,note:f.note,conf:f.conf};
  }
}

// ── 4. 마찰계수 (Colebrook-White, 반복) ──
function colebrook(Re,relEps){
  if(Re<2300) return 64/Re; // 층류
  let f=0.02;
  for(let i=0;i<40;i++){
    const rhs=-2*Math.log10(relEps/3.7+2.51/(Re*Math.sqrt(f)));
    const fn=1/(rhs*rhs); if(Math.abs(fn-f)<1e-7){f=fn;break;} f=fn;
  }
  return f;
}

// ── 5. 상태 ──
const state={phase:'gas',fluid:'NG',flowUnit:'Nm³/h',nps:'6"',sch:'Sch 40',mat:'cs',
  override:{}}; // override: {Z, rho, mu, eps}

// ── 6. 추정 물성 카드 렌더 ──
function currentEps(){
  if(state.override.eps!=null) return state.override.eps;
  return MATERIALS.find(m=>m.key===state.mat).eps;
}
function renderEst(){
  const Tc=parseFloat($('temp').value)||0, Pb=parseFloat($('pres').value)||0;
  const est=estimateProperties(state.fluid,Tc,Pb);
  const grid=$('estGrid'); grid.innerHTML='';
  if(!est.ok){ grid.innerHTML='<div class="nores" style="grid-column:1/3;color:var(--warn)">미지원 유체 — 실측 직접 입력 필요</div>'; return; }
  const eps=currentEps();
  const items=[];
  items.push(['MW',est.MW,'MW']);
  if(est.phase==='gas'){
    items.push(['Z (압축계수)',state.override.Z??est.Z,'Z']);
    items.push(['k (Cp/Cv)',est.k,'k']);
  }
  items.push(['ρ 밀도 kg/m³',state.override.rho??est.rho,'rho']);
  items.push(['μ 점도 Pa·s',(state.override.mu??est.mu).toExponential(2),'mu']);
  items.push(['ε 조도 mm',eps,'eps']);
  items.forEach(([k,v,key])=>{
    const d=document.createElement('div'); d.className='estitem'; d.dataset.key=key;
    d.innerHTML=`<div class="k">${k}</div><div class="v">${v}</div>`;
    if(key==='Z'||key==='rho'||key==='mu'||key==='eps'){ d.onclick=()=>editEst(d,key,est); }
    grid.appendChild(d);
  });
  // Z 비교 표시
  if(est.phase==='gas'&&est.zc){
    const z=est.zc; const note=document.createElement('div');
    note.style.cssText='grid-column:1/3;color:var(--txt3);font-size:10px;margin-top:2px;font-family:JetBrains Mono';
    note.textContent=`Z: Pitzer=${round(z.pitzer.Z,3)} / SK=${round(z.sk.Z,3)} (채택:${z.by})`+(z.warn?` ⚠ ${z.warn}`:'');
    if(z.warn) note.style.color='var(--warn)';
    grid.appendChild(note);
  }
}
function editEst(d,key,est){
  const cur=d.querySelector('.v').textContent;
  d.classList.add('edit');
  d.innerHTML=`<div class="k">${d.dataset.key} 직접입력</div><input value="${cur}" inputmode="decimal"/>`;
  const inp=d.querySelector('input'); inp.focus();
  inp.onblur=()=>{ const val=parseFloat(inp.value);
    if(!isNaN(val)) state.override[key]=val; renderEst(); };
  inp.onkeydown=e=>{ if(e.key==='Enter') inp.blur(); };
}

// ── 7. 계산 실행 ──
function calculate(){
  try{
    const Tc=parseFloat($('temp').value), Pb=parseFloat($('pres').value);
    const flow=parseFloat($('flow').value), L=parseFloat($('len').value);
    if([Tc,Pb,flow,L].some(isNaN)||flow<=0||L<=0){ alert('입력값을 확인하세요 (유량·길이는 0보다 커야 함)'); return; }
    const est=estimateProperties(state.fluid,Tc,Pb);
    if(!est.ok){ alert('미지원 유체입니다. 실측 물성 직접 입력 모드를 사용하세요.'); return; }

    const D=PIPE_ID[state.nps][state.sch]/1000; // m
    const A=Math.PI*D*D/4;
    const eps=currentEps()/1000; // m
    const relEps=eps/D;
    const rho=state.override.rho??est.rho;
    const mu=state.override.mu??est.mu;
    const T=Tc+T0, P1=(Pb+1.01325)*1e5;

    let res={};
    if(est.phase==='liquid'){
      // 질량유량 추정: 입력단위에 따라(간이) — m³/h 가정 우선
      let Q; // m³/s
      const unit=state.flowUnit;
      if(unit==='m³/h') Q=flow/3600;
      else if(unit==='kg/h') Q=(flow/rho)/3600;
      else Q=flow/3600; // Nm³/h는 액체에 부적합 → m³/h로 간주
      const V=Q/A;
      const Re=rho*V*D/mu;
      const f=colebrook(Re,relEps);
      const dP=f*(L/D)*(rho*V*V/2); // Pa
      const dP100=f*(100/D)*(rho*V*V/2)/1e5; // bar/100m
      const outP=Pb-dP/1e5;
      res={phase:'liquid',V,Re,f,dP:dP/1e5,dP100,outP,rho,mu,relEps,D,Z:'-',Ma:'-'};
    } else {
      // 기체: 질량유량 G [kg/m²s]
      const Z=state.override.Z??est.Z;
      const MW=est.MW;
      let mdot; // kg/s
      const unit=state.flowUnit;
      if(unit==='kg/h') mdot=flow/3600;
      else if(unit==='Nm³/h'){ const rhoN=(101325*(MW/1000))/(R_UNIV*T0); mdot=flow*rhoN/3600; }
      else { mdot=flow*rho/3600; } // m³/h(실제) 
      const G=mdot/A; // kg/m²s
      const V=G/rho; // 실제 유속
      const Re=G*D/mu;
      const f=colebrook(Re,relEps);
      // Compressible Darcy: P1²-P2² = f(L/D)·G²·Z·R·T/MW  (SI, R/MW=비기체상수)
      const Rs=R_UNIV/(MW/1000);
      const dP2=f*(L/D)*G*G*Z*Rs*T;
      let P2sq=P1*P1-dP2; let P2=P2sq>0?Math.sqrt(P2sq):0;
      const outP=P2/1e5-1.01325;
      const dPbar=(P1-P2)/1e5;
      const dP100=(P1-Math.sqrt(Math.max(P1*P1-f*(100/D)*G*G*Z*Rs*T,0)))/1e5;
      // 음속 & Mach (출구 기준)
      const a=Math.sqrt(est.k*Z*Rs*T);
      const rho2=P2*(MW/1000)/(Z*R_UNIV*T);
      const V2=rho2>0?G/rho2:Infinity;
      const Ma=V2/a;
      const choked=(Ma>=1||P2<=0);
      res={phase:'gas',V:V2,Vin:V,Re,f,dP:dPbar,dP100,outP,rho,mu,relEps,D,Z,Ma,a,choked};
    }
    renderResult(res);
  }catch(e){ alert('계산 오류: '+e.message); }
}

// ── 8. 판정 ──
const LIMITS={gas:{dP100:0.5,V:30,Ma:0.30},liquid:{dP100:0.5,V:3}};
function renderResult(r){
  const lim=LIMITS[r.phase];
  let fails=[];
  const m=[];
  // 유속
  const vBad=r.V>lim.V; if(vBad)fails.push('유속');
  m.push({k:'유속 Velocity',v:round(r.V,2)+' m/s',a:'허용 '+lim.V,bad:vBad});
  // ΔP/100m
  const dpBad=r.dP100>lim.dP100; if(dpBad)fails.push('ΔP');
  m.push({k:'ΔP / 100m',v:round(r.dP100,3)+' bar',a:'허용 '+lim.dP100,bad:dpBad});
  if(r.phase==='gas'){
    const maBad=r.Ma>lim.Ma; if(maBad)fails.push('Mach');
    m.push({k:'Mach No.',v:round(r.Ma,3),a:'허용 '+lim.Ma,bad:maBad});
    m.push({k:'토출압 Outlet',v:round(r.outP,2)+' barg',a:'입구→출구',bad:false});
    if(r.choked) fails.push('Choked');
  } else {
    m.push({k:'토출압 Outlet',v:round(r.outP,2)+' barg',a:'입구→출구',bad:false});
  }
  const pass=fails.length===0;

  let html=`<div class="verdict ${pass?'pass':'fail'}">
    <div class="vi">${pass?'✓':'✕'}</div>
    <div class="vt"><b>${pass?'PASS':'FAIL'}</b>
    <div>${pass?'1차 검토 기준 통과':'초과: '+fails.join(', ')}${r.choked?' · ⚠Choked Flow 발생가능':''}</div></div></div>`;
  html+='<div class="metrics">';
  m.forEach(x=>{ html+=`<div class="metric ${x.bad?'bad':'ok'}"><div class="mk">${x.k}</div><div class="mv">${x.v}</div><div class="ma">${x.a}</div></div>`; });
  html+='</div>';
  html+=`<button class="detoggle" onclick="this.nextElementSibling.classList.toggle('show')">중간 계산값 보기 ▾</button>`;
  html+='<div class="details">';
  const det=[['Reynolds 수',round(r.Re,0)],['마찰계수 f',round(r.f,4)],['상대조도 ε/D',r.relEps.toExponential(2)],
    ['내경 D',round(r.D*1000,1)+' mm'],['밀도 ρ',round(r.rho,3)+' kg/m³'],['점도 μ',r.mu.toExponential(2)+' Pa·s']];
  if(r.phase==='gas'){ det.push(['압축계수 Z',round(r.Z,4)],['음속 a',round(r.a,1)+' m/s'],['입구유속',round(r.Vin,2)+' m/s']); }
  det.forEach(([k,v])=>{ html+=`<div class="dl"><span class="dk">${k}</span><span class="dv">${v}</span></div>`; });
  html+='</div>';
  html+=`<div class="disclaimer">⚠ 본 결과는 FEED/생산기술 1차 검토 수준(±10~20%)입니다. 상세 설계는 HYSYS/AFT Arrow 등으로 검증하세요. 추정 물성 사용 — 실측값과 차이가 있을 수 있습니다.</div>`;

  $('result').innerHTML=html; $('result').style.display='block';
  // 요약바
  const sv=$('sumval'); sv.classList.add('on');
  sv.textContent=`v=${round(r.V,1)} m/s · ΔP=${round(r.dP100,3)} bar/100m · Ma=${r.phase==='gas'?round(r.Ma,2):'-'} · Out=${round(r.outP,1)} barg`;
  $('result').scrollIntoView({behavior:'smooth',block:'nearest'});
}

// ══════════════════════════════════════════════════════════
//  휠 피커 구현 (탭 후 드래그 굴림 + 관성 + 스냅)
// ══════════════════════════════════════════════════════════
const ITEM_H=44;
let wheelCtx=null; // {items, index, onDone}
function openWheel(title,items,curIdx,onDone){
  wheelCtx={items,index:curIdx,onDone,offset:-curIdx*ITEM_H,vel:0,dragging:false};
  $('wheelTitle').textContent=title;
  const ul=$('wheelList'); ul.innerHTML='';
  items.forEach(it=>{ const li=document.createElement('li'); li.textContent=it; ul.appendChild(li); });
  applyWheel();
  $('wheelScrim').classList.add('show');
}
function applyWheel(){
  const ul=$('wheelList');
  ul.style.transform=`translateY(${wheelCtx.offset}px)`;
  const idx=Math.round(-wheelCtx.offset/ITEM_H);
  [...ul.children].forEach((li,i)=>li.classList.toggle('center',i===idx));
}
function wheelEnd(){
  // 스냅
  let idx=Math.round(-wheelCtx.offset/ITEM_H);
  idx=Math.max(0,Math.min(wheelCtx.items.length-1,idx));
  wheelCtx.index=idx; wheelCtx.offset=-idx*ITEM_H;
  $('wheelList').style.transition='transform .18s ease-out';
  applyWheel();
  setTimeout(()=>{$('wheelList').style.transition='';},180);
}
(function bindWheel(){
  const wheel=$('wheel'); let startY=0, lastY=0, lastT=0;
  const down=y=>{ if(!wheelCtx)return; wheelCtx.dragging=true; wheelCtx.vel=0;
    startY=y; lastY=y; lastT=Date.now(); $('wheelList').style.transition=''; };
  const move=y=>{ if(!wheelCtx||!wheelCtx.dragging)return;
    const dy=y-lastY; wheelCtx.offset+=dy;
    const now=Date.now(); wheelCtx.vel=dy/Math.max(1,now-lastT)*16; lastY=y; lastT=now; applyWheel(); };
  const up=()=>{ if(!wheelCtx||!wheelCtx.dragging)return; wheelCtx.dragging=false;
    // 관성
    let v=wheelCtx.vel;
    const inertia=()=>{ if(Math.abs(v)<0.5||wheelCtx.dragging){ wheelEnd(); return; }
      wheelCtx.offset+=v; v*=0.92;
      const max=0, min=-(wheelCtx.items.length-1)*ITEM_H;
      if(wheelCtx.offset>max+ITEM_H){wheelCtx.offset=max+ITEM_H;v=0;}
      if(wheelCtx.offset<min-ITEM_H){wheelCtx.offset=min-ITEM_H;v=0;}
      applyWheel(); requestAnimationFrame(inertia); };
    requestAnimationFrame(inertia); };
  wheel.addEventListener('touchstart',e=>down(e.touches[0].clientY),{passive:true});
  wheel.addEventListener('touchmove',e=>{move(e.touches[0].clientY);e.preventDefault();},{passive:false});
  wheel.addEventListener('touchend',up);
  wheel.addEventListener('mousedown',e=>down(e.clientY));
  window.addEventListener('mousemove',e=>{if(wheelCtx&&wheelCtx.dragging)move(e.clientY);});
  window.addEventListener('mouseup',up);
})();
$('wheelDone').onclick=()=>{ if(wheelCtx){wheelCtx.onDone(wheelCtx.index);} $('wheelScrim').classList.remove('show'); };
$('wheelCancel').onclick=()=>$('wheelScrim').classList.remove('show');
$('wheelScrim').onclick=e=>{ if(e.target===$('wheelScrim'))$('wheelScrim').classList.remove('show'); };

// ── 휠 연결 ──
$('npsBtn').onclick=()=>openWheel('배관 Size',NPS_LIST,NPS_LIST.indexOf(state.nps),i=>{state.nps=NPS_LIST[i];$('npsLbl').textContent=state.nps;});
$('schBtn').onclick=()=>openWheel('Schedule',SCH_LIST,SCH_LIST.indexOf(state.sch),i=>{state.sch=SCH_LIST[i];$('schLbl').textContent=state.sch;});
$('flowUnitBtn').onclick=()=>openWheel('유량 단위',FLOWUNITS,FLOWUNITS.indexOf(state.flowUnit),i=>{state.flowUnit=FLOWUNITS[i];$('flowUnitLbl').textContent=state.flowUnit;});
$('matBtn').onclick=()=>openWheel('배관 재질',MATERIALS.map(m=>m.label),MATERIALS.findIndex(m=>m.key===state.mat),i=>{
  state.mat=MATERIALS[i].key; $('matLbl').textContent=MATERIALS[i].label; delete state.override.eps; renderEst();});

// ══════════════════════════════════════════════════════════
//  유체 바텀시트
// ══════════════════════════════════════════════════════════
function renderFluidList(filter=''){
  const list=$('fluidList'); list.innerHTML='';
  const fl=filter.toLowerCase();
  const phase=state.phase;
  const ents=Object.entries(FLUID_DB).filter(([k,f])=>f.phase===phase &&
    (f.label.toLowerCase().includes(fl)||k.toLowerCase().includes(fl)));
  if(ents.length===0){
    list.innerHTML='<div class="nores">검색 결과 없음.<br>미지원 유체는 실측 물성 직접 입력 모드를 사용하세요.</div>'; return;
  }
  ents.forEach(([k,f])=>{
    const d=document.createElement('div'); d.className='fitem'+(k===state.fluid?' sel':'');
    d.innerHTML=`<span class="fn">${f.label}</span><span class="ft">${f.conf} · ${f.note}</span>`;
    d.onclick=()=>{ state.fluid=k; $('fluidLbl').textContent=f.label; state.override={};
      $('fluidScrim').classList.remove('show'); renderEst(); };
    list.appendChild(d);
  });
}
$('fluidBtn').onclick=()=>{ $('fluidSearch').value=''; renderFluidList(); $('fluidScrim').classList.add('show'); };
$('fluidSearch').oninput=e=>renderFluidList(e.target.value);
$('fluidCancel').onclick=()=>$('fluidScrim').classList.remove('show');
$('fluidScrim').onclick=e=>{ if(e.target===$('fluidScrim'))$('fluidScrim').classList.remove('show'); };

// ── 상태 토글 ──
$('phaseSeg').querySelectorAll('button').forEach(b=>{
  b.onclick=()=>{ state.phase=b.dataset.ph;
    $('phaseSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('act',x===b));
    // 기본 유체 전환
    state.fluid = state.phase==='gas'?'NG':'WATER';
    $('fluidLbl').textContent=FLUID_DB[state.fluid].label;
    state.override={}; renderEst();
  };
});

// ── 입력 변동 시 추정 갱신 ──
['temp','pres'].forEach(id=>$(id).addEventListener('input',renderEst));
$('calcBtn').onclick=calculate;

// ── 초기 ──
renderEst();
</script>
